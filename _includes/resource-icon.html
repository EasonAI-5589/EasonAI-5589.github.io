{%- if include.image and include.image != '' -%}
<img class="resource-icon" src="{{ include.image | relative_url }}" alt="" width="16" height="16">
{%- elsif include.kind == 'huggingfaceurl' -%}
<img class="resource-icon" src="{{ '/assets/icons/huggingface.svg' | relative_url }}" alt="" width="16" height="16">
{%- else -%}
<svg class="resource-icon resource-icon--outline" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
  {%- case include.kind -%}
  {%- when 'paperurl' -%}
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6"/>
  {%- when 'codeurl' -%}
  <path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1 .1-2-.5-2.5 3-.3 6-1.5 6-6a5 5 0 0 0-1.3-3.5A4.5 4.5 0 0 0 19 2s-1 0-3.5 1.5a13 13 0 0 0-7 0C6 2 5 2 5 2a4.5 4.5 0 0 0-.2 4A5 5 0 0 0 3.5 9.5c0 4.5 3 5.7 6 6C8.9 16 9 17 9 18v4"/>
  {%- when 'projecturl' -%}
  <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18z"/>
  {%- endcase -%}
</svg>
{%- endif -%}
