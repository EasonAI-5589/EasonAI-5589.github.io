  summary: "InferenceNet is a collaborative research initiative investigating whether AI agents can carry out econometric analyses and reproduce key results from published studies. Its benchmark brings together 2,644 tasks from 36 academic journals, pairing task descriptions with published data and author-provided replication code."
  benchmark: "Selected_1000 provides a 1,000-task evaluation subset covering ordinary least squares, difference-in-differences, instrumental variables, regression discontinuity, and other econometric methods."
  contribution: "I work on evaluation pipelines, agent harness integration, and reproducibility audits. This includes connecting agents to controlled Python execution, aligning task inputs and scoring protocols, and investigating failures across data preparation, code generation, execution, and statistical replication."
  current_research: "I am exploring how planning, tool use, and execution feedback affect agents' ability to carry out econometric analyses reliably, through controlled comparisons of direct code generation and agent workflows."
