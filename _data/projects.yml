- id: inferencenet
  name: InferenceNet
  focus: "AI agents for empirical research · Ongoing"
  summary: "A benchmark and research initiative for AI agents that carry out empirical studies in economics, finance, and related fields. The collection contains over 2,644 tasks from 36 journals, pairing task descriptions with published data and author-provided replication code."
  benchmark: "Selected_1000 is a standardized 1,000-task benchmark subset drawn from 10 business and economics journals. It covers ordinary least squares, difference-in-differences, instrumental variables, regression discontinuity, and other econometric methods."
  contribution: "My work focuses on evaluation pipelines and reproducibility audits for AI agents on real-world empirical research tasks."
