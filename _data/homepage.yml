      我目前在<strong>南洋理工大学（NTU）</strong>攻读<strong>计算机科学与工程研究型硕士</strong>，并在 <a href="https://www.ntu.edu.sg/gifts/about">GIFTS</a> 担任 Research Affiliate，很荣幸能在 <a href="https://www.linwilliamcong.com/about">Lin William Cong 教授</a>的指导下，于<a href="https://www.ntu.edu.sg/gifts/research-and-innovation">数字经济与金融科技实验室（DEFT Lab）</a>开展研究。我也在 <a href="https://cs.pku.edu.cn/info/1086/1735.htm">Shanghang Zhang 教授</a>的指导下，与<strong>北京大学计算机学院</strong>的<a href="https://github.com/PKU-HMI-Lab">人机智能实验室（HMI Lab）</a>开展科研合作。此外，我与<strong>哈佛大学</strong>的 <a href="https://eye.hms.harvard.edu/mengyuwang">Mengyu Wang 教授</a>及其 <a href="https://wang.hms.harvard.edu/">Harvard AI and Robotics Lab</a> 长期保持线上科研合作。
    internships_html: >-
      同时，我在<strong>清华大学五道口金融学院</strong>担任 <strong>Research Affiliate</strong>，在 <a href="https://sites.google.com/view/xiaoyanzhang/">Xiaoyan Zhang 教授</a>的指导下开展研究。此前，我曾在<strong>腾讯光子工作室群的新加坡团队</strong>实习。
    research_html: >-
      我的研究兴趣主要集中在<strong>世界模型（World Models）</strong>与 <strong>AI 智能体（AI Agents）</strong>，关注动作条件生成、策略学习，以及智能体运行框架和后训练，面向机器人操作、交易算法与市场分析、计量研究复现等具体任务。我也关注<strong>视觉语言模型（VLMs）</strong>的高效推理与可靠性。
    phd_html: >-
      我计划于 <strong>2027 年春季或秋季</strong>开始博士阶段的研究，目前正在寻找合适的机会。欢迎通过 <a href="mailto:yichen013@e.ntu.edu.sg">yichen013@e.ntu.edu.sg</a> 联系我，交流研究想法、博士机会或合作，也欢迎推荐。
