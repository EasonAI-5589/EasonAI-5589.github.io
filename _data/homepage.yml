  about:
    bio_html: >-
      I am currently pursuing an <strong>M.Eng. (by Research) in Computer Science and Engineering</strong> at <strong>Nanyang Technological University (NTU)</strong> and am a <strong>Research Affiliate at <a href="https://www.ntu.edu.sg/gifts/about">GIFTS</a></strong>. I am honored to work under the guidance of <a href="https://www.linwilliamcong.com/about">Prof. Lin William Cong</a> in the <a href="https://www.ntu.edu.sg/gifts/research-and-innovation">Digital Economy and Financial Technology Lab (DEFT Lab)</a>. I also collaborate with the <a href="https://github.com/PKU-HMI-Lab">Human Machine Intelligence (HMI) Lab</a> at <strong>Peking University's School of Computer Science</strong> under the guidance of <a href="https://www.ai.pku.edu.cn/en/info/1459/2068.htm">Prof. Shanghang Zhang</a>. In addition, I maintain a long-term remote research collaboration with <a href="https://eye.hms.harvard.edu/mengyuwang">Prof. Mengyu Wang</a> and his <a href="https://wang.hms.harvard.edu/">Harvard AI and Robotics Lab</a> at <strong>Harvard University</strong>.
    internships_html: >-
      I am currently a <strong>Data Science Intern at Binance</strong>, working on <strong>AI trading agents and trading algorithms</strong>. Previously, I interned with <strong>Tencent LightSpeed Studios' Singapore team</strong>.
    research_html: >-
      My research interests center on <strong>world models</strong> and <strong>AI agents</strong>, with a focus on action-conditioned generation, policy learning, agent harnesses, and post-training for tasks such as robotic manipulation, trading algorithms, market analysis, and the replication of econometric studies. I also study the efficiency and reliability of <strong>vision-language models (VLMs)</strong>.
    phd_html: >-
      I am seeking <strong>PhD opportunities starting in Spring or Fall 2027</strong>. Feel free to contact me at <a href="mailto:yichen013@e.ntu.edu.sg">yichen013@e.ntu.edu.sg</a> to discuss research ideas, PhD opportunities, or potential collaborations. Recommendations are also welcome.
  interests:
    - label: "World Models"
      text: "Action-conditioned generation, action following, policy training and learning, and unified models, with applications in robotic manipulation."
    - label: "AI Agents"
      text: "Agent harnesses, agentic capabilities such as autonomous planning and tool use, and post-training through supervised fine-tuning (SFT) and reinforcement learning (RL), with applications in trading algorithms, market analysis, and the replication of econometric studies."
    - label: "Vision-Language Models (VLMs)"
      text: "Visual token reduction, efficient inference, and hallucination mitigation to improve model efficiency and reliability."
