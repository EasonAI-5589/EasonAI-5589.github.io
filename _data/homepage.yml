      目前，我在 <strong>Binance</strong> 担任<strong>数据科学实习生</strong>，参与 <strong>AI 交易智能体与交易算法</strong>的研发。此前，我曾在<strong>腾讯光子工作室群的新加坡团队</strong>实习。
