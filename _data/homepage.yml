  projects:
    inferencenet:
      focus: "面向计量经济分析与研究复现的 AI 智能体"
      card_summary: "AI 智能体能否从实证研究问题与数据出发，得到可复现的统计结果？"
      card_contribution: "评测流程、智能体运行框架集成与可复现性审计。"
      highlights:
        - "基准：2,644 项任务 · 36 本期刊"
        - "评测：固定 1,000 项任务子集"
      summary: "InferenceNet 是一项合作研究，探索 AI 智能体能否完成计量经济分析并复现已发表研究的关键结果。基准汇集了来自 36 本学术期刊的 2,644 项任务，将任务描述与已发表的数据、作者提供的复现代码配对。"
      benchmark: "Selected_1000 提供固定的 1,000 项任务评测子集，涵盖普通最小二乘法、双重差分、工具变量、断点回归等计量经济学方法。"
      contribution: "我参与评测流程、智能体运行框架集成与可复现性审计，包括为智能体接入受控的 Python 执行环境、统一任务输入与评分协议，并排查数据准备、代码生成、执行及统计复现各环节的失败原因。"
      current_research: "我正在研究规划、工具调用与执行反馈如何影响智能体可靠完成计量经济分析的能力，包括比较直接代码生成与智能体工作流，并记录模型调用预算和失败类型。"
      image_alt: "Agent + harness 登峰榜：比较 GPT-5.6 Sol 和 Claude Opus 4.8 在单次生成与 Deep Agents 框架下的表现，每组评测 1,000 项任务。"
      image_caption: "Agent + harness 登峰榜 · 2026 年 9 月。每组 1,000 项任务的内部探索性比较，模型调用预算不同。"
      case_label: "查看已记录案例"
